<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoWhisper Settings</title>
  <!-- The AutoWhisper mark, inline so no extra server route is needed. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a1c'/%3E%3Cg stroke='%23f5f5f4' stroke-width='2.4' stroke-linecap='round' fill='none'%3E%3Ccircle cx='16' cy='16' r='6'/%3E%3Cline x1='4' y1='16' x2='7' y2='16'/%3E%3Cline x1='25' y1='16' x2='28' y2='16'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23db4233'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the stored appearance before first paint to avoid a theme flash.
    try {
      var awTheme = localStorage.getItem("aw-theme");
      if (awTheme && awTheme !== "system") document.documentElement.dataset.theme = awTheme;
    } catch (_) {}
  </script>
</head>
<body>
  <div class="aw-shell">
    <aside class="aw-sidebar" aria-label="Settings sections">
      <div class="aw-brand">
        <span class="aw-mark" aria-hidden="true"></span>
        <div>
          <div class="aw-brand-name">AutoWhisper</div>
          <div class="aw-brand-note">local dictation</div>
        </div>
      </div>

      <nav id="settings-nav" class="aw-nav">
        <button type="button" class="aw-nav-item is-active" data-target="dictation">Dictation behavior</button>
        <button type="button" class="aw-nav-item" data-target="fabric">Ask Fabric</button>
        <button type="button" class="aw-nav-item" data-target="model" aria-label="Model & performance">Model &amp; performance</button>
        <button type="button" class="aw-nav-item" data-target="audio">Audio input</button>
        <button type="button" class="aw-nav-item" data-target="output" aria-label="Output & insertion">Output &amp; insertion</button>
        <button type="button" class="aw-nav-item" data-target="privacy">Privacy</button>
        <button type="button" class="aw-nav-item" data-target="feedback" aria-label="Feedback & tray">Feedback &amp; tray</button>
        <button type="button" class="aw-nav-item" data-target="diagnostics">Diagnostics</button>
        <button type="button" class="aw-nav-item" data-target="advanced">Advanced</button>
      </nav>

      <div id="theme-switch" class="aw-theme" role="group" aria-label="Appearance">
        <div class="aw-eyebrow">Appearance</div>
        <div class="aw-theme-options">
          <button type="button" class="aw-theme-option" data-theme-choice="system" aria-pressed="true">Auto</button>
          <button type="button" class="aw-theme-option" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" class="aw-theme-option" data-theme-choice="dark" aria-pressed="false">Dark</button>
          <button type="button" class="aw-theme-option" data-theme-choice="dev" aria-pressed="false">Dev</button>
        </div>
      </div>

      <div class="aw-sidebar-status" aria-label="Runtime summary">
        <span class="aw-dot aw-dot-ok" aria-hidden="true"></span>
        <span>settings served locally</span>
      </div>
    </aside>

    <main class="aw-main">
      <header class="aw-topbar">
        <div>
          <p class="aw-eyebrow" id="active-section-kicker">Settings</p>
          <h1 id="active-section-title">Dictation behavior</h1>
          <p id="active-section-lede">Choose how AutoWhisper listens, cancels, and gets out of your way.</p>
        </div>
        <div class="aw-actions">
          <span id="dirty-pill" class="aw-pill aw-pill-ok">saved</span>
          <button id="reset-btn" class="aw-button" type="button">Reset to defaults</button>
          <button id="save-btn" class="aw-button aw-button-primary" type="button">Save changes</button>
        </div>
      </header>

      <div id="status" class="aw-status" role="status" aria-live="polite"></div>
      <form id="settings-form" class="aw-form" aria-describedby="status"></form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
