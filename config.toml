# AutoWhisper Configuration
# Python/faster-whisper version with distil-large-v3

[model]
# Model Speed Comparison (RTX 5070 Laptop, bfloat16)
# Model	            Mean	Min	Speed	vs Current	Accuracy
# tiny.en	        78ms	19ms	    49x realtime	5.8x faster	✓
# base.en	        143ms	90ms	    27x realtime	3.1x faster	✓
# distil-small.en	198ms	138ms	    19x realtime	2.3x faster	✓
# small.en	        211ms	100ms	    18x realtime	2.1x faster	✓
# distil-medium.en	381ms	158ms	    10x realtime	1.2x faster	✓
# distil-large-v3	448ms	276ms	    8.5x realtime	current	✓
# medium.en	        527ms	321ms	    7.2x realtime	0.8x slower	✓
# large-v3-turbo	657ms	346ms	    5.8x realtime	0.7x slower	✓
# large-v3	        926ms	483ms	    4.1x realtime	0.5x slower	✓
# Model: tiny, base, small, medium, large-v3, distil-large-v3 (recommended)
#size = "distil-large-v3"
size = "distil-small.en"

# Device: cuda, cpu, or auto
device = "cuda"

# Compute type: bfloat16 (fastest for RTX 50xx), float16, int8_float16, int8, float32
compute_type = "bfloat16"

# Beam size (1 = fastest, 5 = more accurate)
beam_size = 1

# Language: "en", "es", "fr", etc. or "auto"
language = "en"

# Number of threads for CPU operations
num_threads = 4

[audio]
# Sample rate (16000 = Whisper native, don't change)
sample_rate = 16000

# Channels (1 = mono, required by Whisper)
channels = 1

# Buffer size in samples (1024 = ~64ms latency, reduces callback overhead)
buffer_size = 1024

# Input device (comment out or use "default" for default microphone)
# device = "default"

# Enable Voice Activity Detection (Silero VAD)
vad_enabled = true

# VAD threshold (0.0 to 1.0, higher = stricter)
vad_threshold = 0.5

# Silence duration to trim (seconds)
silence_duration = 0.3

# Maximum recording duration (seconds, safety limit)
max_duration = 600.0

[hotkeys]
# Mode: "push_to_talk" or "toggle"
# push_to_talk: Hold key to record, release to transcribe
# toggle: Press once to start, again to stop
mode = "push_to_talk"

# Trigger hotkey (start/stop recording)
# Format: "ctrl+alt+v", "shift+super", etc.
# Note: shift+super often conflicts with desktop shortcuts
trigger = "shift+super"

# Cancel hotkey (abort current recording)
cancel = "ctrl+alt+c"

# Allow Escape key to cancel recording (in addition to cancel hotkey)
escape_to_cancel = true

[output]
# Method: "inject" (xdotool/X11) or "clipboard"
method = "inject"

# Also store text in clipboard when using inject method
# Allows you to paste again later with Ctrl+V
also_copy_to_clipboard = true

# Auto-paste after clipboard copy (only used when method = "clipboard")
auto_paste = true

# Delay before paste (seconds)
paste_delay = 0.05

# Add newline after text
append_newline = true

# Lowercase output
lowercase = false

[feedback]
# Enable audio feedback beeps
enabled = true

# Start beep frequency (Hz)
frequency_start = 800

# Stop beep frequency (Hz)
frequency_stop = 400

# Error beep frequency (Hz)
frequency_error = 600

# Beep duration (seconds)
duration = 0.1

# Beep volume (0.0 - 1.0)
volume = 0.3

[daemon]
# Log level: trace, debug, info, warn, error
log_level = "info"

# Log file path (comment out to use stderr/journald only)
# log_file = "/var/log/autowhisper.log"

# PID file location
pid_file = "/tmp/autowhisper.pid"

# Working directory
work_dir = "/opt/autowhisper"
