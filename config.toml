[audio]
buffer_size = 1024
channels = 1
max_duration = 600.0
mute_other_apps = false
sample_rate = 16000
silence_duration = 0.3
vad_enabled = true
vad_threshold = 0.5

[daemon]
# log_level: trace, debug, info, warn, error, critical, off
log_level = 'info'
pid_file = '/tmp/autowhisper.pid'
work_dir = '/opt/autowhisper'

[feedback]
duration = 0.1
enabled = true
frequency_error = 600
frequency_start = 800
frequency_stop = 400
volume = 0.3

[formatting]
# Remove hesitation words (um, uh, ...). English only.
remove_fillers = true
# Turn standalone "new line" / "new paragraph" into real line breaks.
spoken_commands = true
# Personal dictionary: 'spoken => written'.
# dictionary = [ 'auto whisper => AutoWhisper' ]
dictionary = [ ]

[hotkeys]
cancel = [ 'esc' ]
escape_to_cancel = true
# mode: push_to_talk, toggle
mode = 'push_to_talk'
trigger = [ 'shift+super' ]

[model]
beam_size = 1
# compute_type: float16, float32, int8, int8_float16, int8_float32, int8_bfloat16, bfloat16
compute_type = 'bfloat16'
# device: cuda, cpu, auto
device = 'cuda'
language = 'en'
num_threads = 4
# size: tiny, tiny.en, base, base.en, small, small.en, medium, medium.en,
#       large, large-v1, large-v2, large-v3, large-v3-turbo,
#       distil-large-v2, distil-large-v3, distil-medium.en, distil-small.en
# language: ISO 639-1 code, or 'auto' to detect (needs a multilingual model)
size = 'distil-small.en'

[output]
also_copy_to_clipboard = true
auto_paste = true
# ending_action: none, newline, return_key
ending_action = 'none'
lowercase = false
# method: inject, clipboard
method = 'inject'
paste_delay = 0.05

[tray]
enabled = true

[avatar]
# The floating companion. Glows while listening, writes while inserting.
enabled = false
# character: echo (answers), hermes (swift, winged), mnemosyne (memory),
#            kalliope (the muse, crowned), morpheus (dreams, motes)
character = 'echo'
size = 96
