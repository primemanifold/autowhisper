name: Bug report
description: Something broke or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: platform
    attributes:
      label: OS and version
      placeholder: "Windows 11 23H2 / Ubuntu 24.04 X11 / macOS 14.5"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Release version, CI run/artifact ID, or commit SHA
      placeholder: "autowhisper-windows-x86_64-msvc from run 27427614064"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps you took, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: autowhisper doctor output
      description: Paste the output for runtime problems (mic, hotkeys, injection).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots / suspected source file
      description: journalctl --user -u autowhisper, console output, or a file under src/ if you found one.
