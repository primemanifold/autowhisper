name: Feature request
description: Something AutoWhisper should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen, on which platforms?
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap fit (optional)
      description: If you checked docs/plans/2026-06-12-production-readiness-plan.md, which milestone does this belong to?
      placeholder: "M2 Windows / M4 intelligence / M5 sign-on / new"
