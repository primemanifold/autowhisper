name: CI

on:
  push:
    branches: [core]
  pull_request:
    branches: [core]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libpulse-dev \
            libssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAUTOWHISPER_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

  build-deb:
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            cmake \
            g++ \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libpulse-dev \
            libssl-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          ls -la ../autowhisper_*.deb

      - name: Verify package contents
        run: |
          dpkg -c ../autowhisper_*.deb
          dpkg -I ../autowhisper_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: ../autowhisper_*.deb
          retention-days: 7

  build-source:
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            cmake \
            g++ \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libpulse-dev \
            libssl-dev

      - name: Build source package (unsigned)
        run: |
          dpkg-buildpackage -us -uc -S -d
          ls -la ../autowhisper_*.dsc ../autowhisper_*.tar.*

      - name: Run lintian on source
        run: |
          sudo apt-get install -y lintian
          lintian ../autowhisper_*.dsc || true
