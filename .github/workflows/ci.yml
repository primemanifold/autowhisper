name: CI

on:
  push:
    branches: [main, core]
  pull_request:
    branches: [main, core]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev portaudio19-dev
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "Tests completed"

  build-deb:
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            dh-python \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pip \
            python3-setuptools \
            python3-dev \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            portaudio19-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          ls -la ../autowhisper_*.deb

      - name: Verify package contents
        run: |
          dpkg -c ../autowhisper_*.deb
          dpkg -I ../autowhisper_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: ../autowhisper_*.deb
          retention-days: 7

  build-source:
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dh-python pybuild-plugin-pyproject

      - name: Build source package (unsigned)
        run: |
          dpkg-buildpackage -us -uc -S -d
          ls -la ../autowhisper_*.dsc ../autowhisper_*.tar.*

      - name: Run lintian on source
        run: |
          sudo apt-get install -y lintian
          lintian ../autowhisper_*.dsc || true
