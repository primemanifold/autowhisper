<!doctype html>
<!-- AutoWhisper watchOS design preview (concept comp, not a shipping app).
     Companion: the watch records, the paired iPhone transcribes on-device.
     watchOS is dark by convention — one bare screen, no fake hardware. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoWhisper watchOS — design preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: oklch(0.965 0 0);
         font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
         display: grid; place-items: center; min-height: 100vh; padding: 40px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 8px 6px; }
  .screen { --aw-signal: oklch(0.640 0.205 28); width: 198px; height: 242px; border-radius: 44px; background: black;
            display: flex; flex-direction: column; align-items: center;
            padding: 22px 18px 18px; gap: 12px;
            box-shadow: 0 22px 60px oklch(0 0 0 / .22); }
  .app { font-size: 13px; font-weight: 650; color: oklch(0.95 0 0); letter-spacing: -.01em; }
  /* Motion: status-only cues per platform research (breathing record
     affordance + live caret). Stills must read perfectly without it. */
  .mic { width: 78px; height: 78px; border-radius: 50%; flex-shrink: 0; margin-top: 6px;
         background: var(--aw-signal); display: grid; place-items: center; position: relative; }
  .mic::after { content: ""; position: absolute; inset: -7px; border-radius: 50%;
               border: 2px solid color-mix(in oklch, var(--aw-signal) 40%, transparent);
               animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .85; }
                       50% { transform: scale(1.1); opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  .mic svg { width: 32px; height: 32px; fill: white; }
  .hint { font-size: 11px; color: oklch(0.60 0 0); }
  .note { margin-top: auto; width: 100%; font-size: 11px; line-height: 1.35;
          color: oklch(0.78 0 0); overflow: hidden; display: -webkit-box;
          -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .caption { color: oklch(0.45 0 0); font-size: 12px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="stage">
  <div class="screen">
    <span class="app">AutoWhisper</span>
    <div class="mic"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg></div>
    <span class="hint">Hold — types on iPhone</span>
    <p class="note">Move the deploy to Thursday morning and tell the team in standup.</p>
  </div>
  <span class="caption">watchOS — design preview, not yet shipping</span>
</div>
</body>
</html>
